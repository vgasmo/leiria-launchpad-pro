name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Gate 1: Lint + Typecheck + Build
  # ──────────────────────────────────────────────
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || {
            echo "⚠️ npm ci failed — syncing lockfile and retrying..."
            npm install --package-lock-only --no-audit --no-fund
            npm ci
          }

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit -p tsconfig.typecheck.json

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build
          VITE_SUPABASE_PROJECT_ID: example

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful"

  # ──────────────────────────────────────────────
  # Gate 2: Vitest unit/integration tests
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || {
            echo "⚠️ npm ci failed — syncing lockfile and retrying..."
            npm install --package-lock-only --no-audit --no-fund
            npm ci
          }

      - name: Run Vitest unit tests
        run: npx vitest run --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build
          VITE_SUPABASE_PROJECT_ID: example

  # ──────────────────────────────────────────────
  # Gate 5: i18n key parity (EN ↔ PT)
  # ──────────────────────────────────────────────
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: i18n key parity check
        run: node scripts/i18n-check.cjs

  # ──────────────────────────────────────────────
  # Gate: i18n lint (duplicates, EN-in-PT, missing keys)
  # ──────────────────────────────────────────────
  i18n-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: i18n sync (populate missing keys)
        run: node scripts/i18n-sync.cjs

      - name: i18n lint (strict)
        run: node scripts/i18n-lint.mjs

  # ──────────────────────────────────────────────
  # Gate: i18n sync must be committed (no drift)
  # ──────────────────────────────────────────────
  i18n-sync-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run i18n sync
        run: node scripts/i18n-sync.cjs

      - name: Verify no changes after sync
        run: |
          if ! git diff --exit-code src/i18n/locales; then
            echo "📋 i18n sync produced changes (showing first 60 lines):"
            git diff src/i18n/locales | head -60
            echo ""
            echo "Auto-applying sync output..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/i18n/locales
            git diff --cached --quiet && echo "✅ No staged changes" || {
              git commit -m "chore(i18n): auto-sync locale files [skip ci]"
              echo "⚠️ i18n sync committed automatically. This commit won't re-trigger CI."
            }
          fi
          echo "✅ i18n locales are in sync"

  # ──────────────────────────────────────────────
  # Gate: Secret leak scan
  # ──────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan for hardcoded secrets
        run: node scripts/secret-scan.cjs

  # ──────────────────────────────────────────────
  # Gates 3, 7, 8, 9: Playwright E2E tests
  # Uses local Supabase — no secrets required
  # ──────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || {
            echo "⚠️ npm ci failed — syncing lockfile and retrying..."
            npm install --package-lock-only --no-audit --no-fund
            npm ci
          }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fix migration ordering (investor_readiness prereqs)
        run: |
          cat > supabase/migrations/20260102000000_prereq_investor_readiness.sql << 'EOF'
          CREATE TABLE IF NOT EXISTS public.investor_readiness_items (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              title text NOT NULL,
              description text,
              category text NOT NULL,
              stage text NOT NULL,
              program_id uuid REFERENCES public.programs(id) ON DELETE SET NULL,
              sort_order integer NOT NULL DEFAULT 0,
              is_active boolean NOT NULL DEFAULT true,
              created_at timestamp with time zone NOT NULL DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS public.investor_update_templates (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              name text NOT NULL,
              description text,
              audience text NOT NULL DEFAULT 'investors',
              sections_json jsonb NOT NULL DEFAULT '[]'::jsonb,
              sort_order integer NOT NULL DEFAULT 0,
              is_active boolean NOT NULL DEFAULT true,
              created_by uuid,
              created_at timestamp with time zone NOT NULL DEFAULT now(),
              updated_at timestamp with time zone NOT NULL DEFAULT now()
          );
          EOF

      - name: Start local Supabase
        run: supabase start

      - name: Get Supabase status
        id: supabase
        run: |
          # Extract values from supabase status
          API_URL=$(supabase status --output json | jq -r '.API_URL // empty' 2>/dev/null || supabase status | grep 'API URL' | awk '{print $NF}')
          ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY // empty' 2>/dev/null || supabase status | grep 'anon key' | awk '{print $NF}')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY // empty' 2>/dev/null || supabase status | grep 'service_role key' | awk '{print $NF}')

          # Fallback defaults for local supabase
          API_URL=${API_URL:-http://127.0.0.1:54321}
          ANON_KEY=${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
          SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT
          echo "✅ Supabase local: $API_URL"

      - name: Seed test data
        run: npx tsx scripts/e2e/seed-local-supabase.ts
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}

      - name: Build app for E2E
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.anon_key }}
          VITE_SUPABASE_PROJECT_ID: local

      - name: Start preview server
        run: npx vite preview --port 5173 &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 15000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Gate 4: pgTAP database tests
  # ──────────────────────────────────────────────
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.ENABLE_DB_TESTS == 'true' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fix migration ordering (investor_readiness prereqs)
        run: |
          # Create prerequisite tables before the migration that references them
          cat > supabase/migrations/20260102000000_prereq_investor_readiness.sql << 'EOF'
          CREATE TABLE IF NOT EXISTS public.investor_readiness_items (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              title text NOT NULL,
              description text,
              category text NOT NULL,
              stage text NOT NULL,
              program_id uuid REFERENCES public.programs(id) ON DELETE SET NULL,
              sort_order integer NOT NULL DEFAULT 0,
              is_active boolean NOT NULL DEFAULT true,
              created_at timestamp with time zone NOT NULL DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS public.investor_update_templates (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              name text NOT NULL,
              description text,
              audience text NOT NULL DEFAULT 'investors',
              sections_json jsonb NOT NULL DEFAULT '[]'::jsonb,
              sort_order integer NOT NULL DEFAULT 0,
              is_active boolean NOT NULL DEFAULT true,
              created_by uuid,
              created_at timestamp with time zone NOT NULL DEFAULT now(),
              updated_at timestamp with time zone NOT NULL DEFAULT now()
          );
          EOF

      - name: Start local Supabase (applies all migrations)
        run: supabase start

      - name: Verify migrations applied
        run: supabase migration list --local

      - name: Lint database schema
        run: supabase db lint

      - name: Run pgTAP tests
        run: supabase test db
