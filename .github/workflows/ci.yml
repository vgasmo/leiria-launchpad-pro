name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Gate 1: Lint + Typecheck + Build
  # ──────────────────────────────────────────────
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit -p tsconfig.typecheck.json

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build
          VITE_SUPABASE_PROJECT_ID: example

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful"

  # ──────────────────────────────────────────────
  # Gate 2: Vitest unit/integration tests
  # (includes Gate 6: i18n runtime gate)
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npx vitest run --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build
          VITE_SUPABASE_PROJECT_ID: example

  # ──────────────────────────────────────────────
  # Gate 5: i18n key parity (EN ↔ PT)
  # ──────────────────────────────────────────────
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: i18n key parity check
        run: node scripts/i18n-check.cjs

  # ──────────────────────────────────────────────
  # Gate: Secret leak scan
  # ──────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan for hardcoded secrets
        run: node scripts/secret-scan.cjs

  # ──────────────────────────────────────────────
  # Gates 3, 7, 8, 9: Playwright E2E tests
  # (role flows, navigation, permissions, a11y)
  # ──────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_KEY || 'dummy-key-for-build' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.E2E_SUPABASE_PROJECT_ID || 'example' }}

      - name: Start preview server
        run: npx vite preview --port 5173 &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 15000

      - name: Check E2E credentials
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$E2E_CONSULTANT_EMAIL" ]; then
            echo "::error::E2E_CONSULTANT_EMAIL not set"
            exit 1
          fi

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          E2E_CONSULTANT_EMAIL: ${{ secrets.E2E_CONSULTANT_EMAIL }}
          E2E_CONSULTANT_PASSWORD: ${{ secrets.E2E_CONSULTANT_PASSWORD }}
          E2E_FOUNDER_EMAIL: ${{ secrets.E2E_FOUNDER_EMAIL }}
          E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
          E2E_MENTOR_EMAIL: ${{ secrets.E2E_MENTOR_EMAIL }}
          E2E_MENTOR_PASSWORD: ${{ secrets.E2E_MENTOR_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Gate 4: pgTAP database tests
  # ──────────────────────────────────────────────
  db-tests:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DB_TESTS == 'true' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run pgTAP tests
        run: |
          echo "Running pgTAP tests against linked project..."
          supabase test db --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
