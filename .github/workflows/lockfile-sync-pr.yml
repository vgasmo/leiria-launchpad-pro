name: lockfile sync (auto PR)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Atualiza apenas o package-lock.json (sem instalar node_modules)
      - name: Update package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      # Confirma que agora npm ci já passa
      - name: Verify npm ci works
        run: npm ci

      - name: Create PR with updated lockfile
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/lockfile-sync
          title: "chore: sync package-lock"
          commit-message: "chore: sync package-lock"
          body: |
            Auto-generated by GitHub Actions to fix npm ci lockfile drift.
          add-paths: |
            package-lock.json
